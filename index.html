<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ContaHogar - Gestión Financiera del Hogar</title>
    <meta name="description" content="ContaHogar: Tu aplicación para gestionar las finanzas del hogar. Controla gastos, ingresos y categorías de forma simple e intuitiva." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ContaHogar" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <meta property="og:title" content="ContaHogar - Gestión Financiera del Hogar" />
    <meta property="og:description" content="Controla tus finanzas domésticas de manera simple e intuitiva" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body translate="no">
    <div id="root"></div>
    <script>
      window.addEventListener('error', (event) => {
        document.body.innerHTML += '<div style="color:red; background:white; padding:20px; position:absolute; top:0; left:0; z-index:9999; font-family:monospace;">' + event.message + '<br>' + event.filename + ':' + event.lineno + '</div>';
      });
      window.addEventListener('unhandledrejection', (event) => {
        document.body.innerHTML += '<div style="color:red; background:white; padding:20px; position:absolute; top:0; left:0; z-index:9999; font-family:monospace;">Unhandled Promise Rejection: ' + (event.reason && event.reason.message ? event.reason.message : String(event.reason)) + '</div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
